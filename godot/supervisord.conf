[supervisord]
nodaemon=true

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 1280x800x24
autorestart=true

[program:fluxbox]
command=/usr/bin/fluxbox -display :0
autorestart=true
depends_on=xvfb

[program:x11vnc]
command=/usr/bin/x11vnc -display :0 -forever -shared -nopw -rfbport 5900
autorestart=true
depends_on=fluxbox

[program:websockify]
command=/usr/bin/websockify --web /usr/share/novnc/ 6080 localhost:5900
autorestart=true
depends_on=x11vnc

[program:godot]
command=/usr/local/bin/godot --path /godot/project
environment=DISPLAY=:0,SIM_WS_URL=ws://python-sim:8765
autorestart=true
depends_on=xvfb