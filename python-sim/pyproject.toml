[project]
name = "maree-simulation"
version = "0.1.0"
description = "MARÉE — simulation multi-agents LLM d'évacuation de foule (projet 5A IABD)"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.10,<0.12",
    "websockets>=12,<14",
    "httpx>=0.27",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "click>=8.1",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"