# ============================================================
# MARÉE — configuration du test de bout en bout Godot <-> stack réelle
#
# Objectif : exercer TOUTE la chaîne avec un vrai modèle :
#   Redpanda (Kafka) -> Orchestrator -> agents LLM (llama.cpp) -> RAG
#   -> indicateurs -> journal JSONL -> WebSocket -> Godot (D1/D2/D3)
#   -> commandes/inspections -> Orchestrator -> rejeu E3.
#
# Population réduite (2 LLM E2B + 4 règles) et 5 ticks : même couverture,
# durée maîtrisée (~1-2 min). E4B n'est pas utilisée ici : elle ne tient
# pas sur la RTX 3050 4 Go (OOM vérifié) — voir docs/JOURNAL.md.
# ============================================================

run_id: e2e_godot
seed: 42
mode: sync
tick_duration_ms: 1000
max_ticks: 5

world:
  smoke_tick: 2
  smoke_spread_interval: 6
  evac_duration_ticks: 900
  pre_days_ticks: 4320

population:
  - name: visiteur
    count: 2
    kind: llm
    model: gemma4-e2b
    temperature: 0.1
  - name: foule
    count: 4
    kind: rules

llm:
  base_url: http://llama-cpp:8081/v1

log_dir: /logs
collect:
  sample_size: 10
