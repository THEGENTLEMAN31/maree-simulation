# C7 — population 20 agents (5 LLM + 15 règles), même scénario que c7-60.
run_id: c7_20
seed: 42
mode: async
tick_duration_ms: 1000
max_ticks: 30
world:
  smoke_tick: 10
  smoke_spread_interval: 6
  evac_duration_ticks: 900
  pre_days_ticks: 4320
  decision_period_sync: 5
population:
  - name: famille
    count: 1
    kind: llm
    model: gemma4-e2b
    temperature: 0.3
    think_interval: 5
  - name: securite
    count: 1
    kind: llm
    model: gemma4-e2b
    temperature: 0.2
    think_interval: 5
  - name: habitue
    count: 1
    kind: llm
    model: gemma4-e2b
    temperature: 0.2
    think_interval: 5
  - name: visiteur
    count: 1
    kind: llm
    model: gemma4-e2b
    temperature: 0.3
    think_interval: 5
  - name: amis
    count: 1
    kind: llm
    model: gemma4-e2b
    temperature: 0.4
    think_interval: 5
  - name: foule
    count: 15
    kind: rules
llm:
  base_url: http://llama-cpp:8081/v1
log_dir: /logs
collect:
  sample_size: 20
