# ============================================================
# MARÉE — override de test de bout en bout (chaîne réelle)
#
# Usage :
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d \
#     redpanda llama-cpp python-sim godot-headless
#
# - python-sim exécute le run court e2e-godot.yaml (vrai modèle E2B) ;
# - godot-headless exécute le client de test (assertions D1/D2/B2/D3)
#   au lieu de la scène interactive.
#
# Le script scripts/run_e2e.sh orchestre tout (attente, rejeu E3, bilan).
# ============================================================

services:
  python-sim:
    # Config choisie par l'appelant (sync par défaut, async via E2E_CONFIG).
    command: python -m src.cli run --config /config/${E2E_CONFIG:-e2e-godot.yaml}

  godot-headless:
    # Monte le projet courant (itérations sans rebuild de l'image).
    volumes:
      - ./godot/project:/godot/project
    # Le client de test se connecte dès que le relais est prêt (il réessaie).
    command:
      - godot
      - --path
      - /godot/project
      - --headless
      - --script
      - res://tests/run_e2e_client.gd
    depends_on:
      python-sim:
        condition: service_started
