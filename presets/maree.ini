# ============================================================
# MARÉE v2 — preset llama.cpp router
#
# Deux modèles résidents (--models-max 2) :
#   gemma4-e2b  : décisions des agents ET chroniqueur (2,9 Go, GPU entier)
#   bge-m3      : embeddings du RAG (417 Mo, GPU entier)
#
# POURQUOI parallel = 4 (changement majeur v2)
# ------------------------------------------------------------
# La v1 tournait avec parallel = 1 : débit mesuré 1 / 2,8 s = 0,36 décision/s.
# Une foule de 60 agents qui re-déciderait toutes les 30 s demanderait
# 2 décisions/s, soit 5,6x la capacité. D'où la file d'attente et les runs
# 3x plus lents que le temps réel.
#
# Avec 4 slots : 4 / 2,8 s = 1,43 décision/s, soit 4x plus.
# Combiné au déclenchement événementiel (on ne décide que si quelque chose
# change), la charge réelle tombe autour de 0,2 décision/s : marge x7.
#
# ATTENTION — le contexte est RÉPARTI entre les slots :
#   ctx-size = slots x fenêtre voulue  ->  4 x 2048 = 8192
# Un ctx-size de 4096 avec 4 slots donnerait 1024 tokens par slot, et les
# prompts réels (~700 tokens + sortie 256) seraient rejetés.
#
# BUDGET VRAM (RTX 3050, 4 Go) : E2B 2,9 Go + bge-m3 0,4 Go
# + KV q8_0 pour 4 slots x 2048. À MESURER au premier `make up` :
#   nvidia-smi ; si OOM, passer parallel à 2 (ctx-size 4096).
#
# E4B (4,7 Go) ne tient pas : offload partiel (n-gpu-layers = 20) et il
# évince un des deux modèles résidents. Réservé aux runs X4 sans RAG.
# ============================================================

[*]
ctx-size = 8192
parallel = 4
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
batch-size = 512
ubatch-size = 256
threads = 16

[gemma4-e2b]
model = /models/gemma-4-E2B-it-Q4_K_M.gguf
alias = gemma4-e2b
ctx-size = 8192
parallel = 4
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.3
top-k = 40
top-p = 0.9
; Sans --reasoning off, Gemma 4 produit ~460 tokens de raisonnement
; par décision (9 s/appel). Le raisonnement est coupé côté requête
; (configs/llm/llamacpp.yaml) ; ceinture et bretelles ici.
reasoning = off

[bge-m3]
model = /models/embed/bge-m3-q4km.gguf
alias = bge-m3
ctx-size = 1024
parallel = 1
n-gpu-layers = 99
embedding = on
; bge-m3 est un BERT : pooling CLS (le mean pooling dégrade nettement).
pooling = cls
batch-size = 1024
ubatch-size = 1024

[qwen3-0-6b]
model = /models/Qwen3-0.6B-Q4_K_M.gguf
; le routeur normalise les points en tirets : `qwen3-0.6b` devient
; `qwen3-0-6b`. On déclare directement le nom annoncé.
alias = qwen3-0-6b
; A5 : le « petit » modèle (378 Mo). Même fenêtre que le grand pour que
; les prompts soient interchangeables d'un tier à l'autre ; le KV d'un
; 0,6B est négligeable devant celui d'un 2B.
ctx-size = 8192
parallel = 4
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.3
top-k = 40
top-p = 0.9
reasoning = off

[gemma4-e4b]
model = /models/gemma-4-E4B-it-Q4_K_M.gguf
alias = gemma4-e4b
ctx-size = 4096
parallel = 1
n-gpu-layers = 20
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.2
top-k = 40
top-p = 0.9
reasoning = off
