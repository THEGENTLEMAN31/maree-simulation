# ============================================================
# MARÉE — preset llama.cpp router (mode multi-modèles)
# Deux modèles Gemma 4 : E2B (rapide) + E4B (raisonnement)
#
# Aligné sur llama.cpp b11609 : les clés INI reprennent les options
# longues du serveur (sans `--`). Les anciennes clés `kv-cache-type`,
# `mlock`, `no-mmap` ne sont PAS supportées par ce build.
#
# ATTENTION au calcul du contexte en mode router : llama-server répartit
# `ctx-size` entre les `--parallel` slots. Avec 15 slots, un `ctx-size` de
# 8192 ne laissait que ~546 tokens par requête et le serveur rejetait les
# prompts réels (« exceeds the available context size »). On dimensionne
# donc `ctx-size` = slots x fenêtre voulue (4 slots x 2048 = 8192), ce qui
# suffit aux prompts de MARÉE (~700 tokens) tout en gardant un KV raisonnable.
#
# Budget VRAM (RTX 3050 4 Go) :
#   - E2B (2,9 Go de poids) tient intégralement sur le GPU ;
#   - E4B (4,7 Go) ne tient PAS : offload partiel CPU (n-gpu-layers = 20),
#     OOM vérifié avec 99 ;
#   - les deux modèles ne peuvent pas être résidents en même temps :
#     garder --models-max 1 (llama.cpp évince/recharge à la demande).
# ============================================================

[*]
; 4 slots x 2048 tokens = 8192 (fenêtre utile par requête = 2048).
ctx-size = 8192
parallel = 4
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
batch-size = 512
ubatch-size = 256
threads = 16

[gemma4-e2b]
model = /models/gemma-4-E2B-it-Q4_K_M.gguf
alias = gemma4-e2b
ctx-size = 8192
parallel = 4
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.3
top-k = 40
top-p = 0.9

[gemma4-e4b]
model = /models/gemma-4-E4B-it-Q4_K_M.gguf
alias = gemma4-e4b
ctx-size = 4096
; E4B (4,7 Go de poids) ne tient PAS entièrement dans les 4 Go de la
; RTX 3050 : offload partiel CPU obligatoire (OOM vérifié avec 99).
n-gpu-layers = 20
parallel = 1
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.2
top-k = 40
top-p = 0.9
