# ============================================================
# MARÉE — preset llama.cpp router (mode multi-modèles)
# E2B (décisions) + e5-small (embeddings RAG) + E4B (runs ciblés)
#
# Aligné sur llama.cpp b11609 : les clés INI reprennent les options
# longues du serveur (sans `--`). Les anciennes clés `kv-cache-type`,
# `mlock`, `no-mmap` ne sont PAS supportées par ce build.
#
# RAG : un vrai embeddeur multilingue (`bge-m3`, Q4_K_M, 417 Mo) tourne sur
# le GPU dans le même routeur. Mesuré : E2B + bge-m3 = 3692 Mio / 4096, les
# deux servent en même temps (chat + lot de 60 embeddings + chat validé).
# Un `e5-small` a été essayé d'abord : embeddings dégénérés (cosinus 0,93
# entre textes sans rapport, précision@1 = 0,17). bge-m3 : précision@1 = 0,70.
# bge-m3 Q8 (605 Mo) ne rentre pas ; Q4_K_M (417 Mo) tient.
#
# ATTENTION au calcul du contexte en mode router : llama-server répartit
# `ctx-size` entre les `--parallel` slots. On dimensionne donc
# `ctx-size` = slots x fenêtre voulue (4 slots x 2048 = 8192) pour E2B.
#
# Budget VRAM (RTX 3050 4 Go) :
#   - E2B (2,9 Go de poids) tient intégralement sur le GPU ;
#   - bge-m3 Q4 (417 Mo) tient à côté d'E2B : RAG toujours chaud ;
#   - E4B (4,7 Go) ne tient PAS : offload partiel CPU (n-gpu-layers = 20),
#     OOM vérifié avec 99. Il évince l'un des deux modèles résidents
#     (--models-max 2) : on le réserve aux runs X4/E5 avec RAG désactivé.
# ============================================================

[*]
; 1 slot x 4096 = 4096 : les prompts MARÉE font ~700 tokens, et un KV plus
; petit laisse de la place à bge-m3 dans les 4 Go.
ctx-size = 4096
parallel = 1
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
batch-size = 512
ubatch-size = 256
threads = 16

[gemma4-e2b]
model = /models/gemma-4-E2B-it-Q4_K_M.gguf
alias = gemma4-e2b
ctx-size = 4096
parallel = 1
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.3
top-k = 40
top-p = 0.9

[bge-m3]
; Embeddeur multilingue du RAG (417 Mo) — résident avec E2B.
model = /models/embed/bge-m3-q4km.gguf
alias = bge-m3
ctx-size = 1024
parallel = 1
n-gpu-layers = 99
embedding = on
; bge-m3 est un BERT : pooling CLS (le mean pooling dégrade nettement).
pooling = cls
batch-size = 1024
ubatch-size = 1024

[gemma4-e4b]
model = /models/gemma-4-E4B-it-Q4_K_M.gguf
alias = gemma4-e4b
ctx-size = 4096
; E4B (4,7 Go de poids) ne tient PAS entièrement dans les 4 Go de la
; RTX 3050 : offload partiel CPU obligatoire (OOM vérifié avec 99).
n-gpu-layers = 20
parallel = 1
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.2
top-k = 40
top-p = 0.9
