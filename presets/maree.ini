# ============================================================
# MARÉE — preset llama.cpp router (mode multi-modèles)
# Deux modèles Gemma 4 résidents : E2B (rapide) + E4B (raisonnement)
# Tient dans 4 Go de VRAM (voir docs/architecture.md § infer)
# ============================================================

[*]
; Contexte des deux modèles calibré pour le budget VRAM
ctx-size = 8192
n-gpu-layers = 99
flash-attn = true
kv-cache-type = q8_0
batch-size = 512
ubatch-size = 256
threads = 16
mlock = false
no-mmap = false
cont-batching = true
verbose = false

[gemma4-e2b]
model = /models/gemma-4-2b-it-Q4_K_M.gguf
alias = gemma4-e2b
ctx-size = 8192
n-gpu-layers = 99
flash-attn = true
kv-cache-type = q8_0
temp = 0.3
top-k = 40
top-p = 0.9

[gemma4-e4b]
model = /models/gemma-4-4b-it-Q4_K_M.gguf
alias = gemma4-e4b
ctx-size = 8192
n-gpu-layers = 99
flash-attn = true
kv-cache-type = q8_0
temp = 0.2
top-k = 40
top-p = 0.9