version: '3.9'

services:
  # ============================================================
  # REDPANDA - Kafka KRaft + Schema Registry + Console
  # ============================================================
  redpanda:
    image: docker.redpandadata/redpanda:v26.2.4
    container_name: maree-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "9092:9092"      # Kafka API
      - "9644:9644"      # Admin API
      - "8081:8081"      # Schema Registry (built-in)
      - "8080:8080"      # Redpanda Console (HTTP)
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    environment:
      REDPANDA_RPK_ENABLE_SASL: "false"
      REDPANDA_DEVELOPER_MODE: "true"
      REDPANDA_LOG_LEVEL: "info"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--timeout=5s"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - maree-net

  # ============================================================
  # LLAMA.CPP ROUTER - Gemma 4 E2B (resident) + E4B (resident)
  # ============================================================
  llama-cpp:
    build:
      context: ./llama.cpp
      dockerfile: Dockerfile.cuda
    container_name: maree-llama-cpp
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - GGML_CUDA_FORCE_MMQ=1
    volumes:
      - ./models:/models:ro
      - ./presets:/presets:ro
    command: >
      llama-server
      --host 0.0.0.0
      --port 8080
      --models-preset /presets/maree.ini
      --models-max 2
      --parallel 15
      --ctx-size 4096
      --n-gpu-layers 99
      --flash-attn on
      --kv-cache-type q8_0
      --batch-size 512
      --ubatch-size 512
      --threads 16
      --mlock
      --no-webui
      --metrics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - maree-net

  # ============================================================
  # PYTHON SIMULATION - Orchestrateur, agents, RAG, Kafka, WS
  # ============================================================
  python-sim:
    build:
      context: ./python-sim
      dockerfile: Dockerfile
    container_name: maree-python-sim
    runtime: nvidia
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - LLM_BASE_URL=http://llama-cpp:8080/v1
      - RAG_DB_PATH=/data/rag
      - WORLD_CORPUS_PATH=/world_corpus
      - SIMULATION_CONFIG=/config/simulation.yaml
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - ./python-sim/src:/app/src:ro
      - ./python-sim/config:/config:ro
      - ./world_corpus:/world_corpus:ro
      - sim-data:/data
      - sim-logs:/logs
    command: python -m src.orchestrator --config /config/simulation.yaml
    depends_on:
      redpanda:
        condition: service_healthy
      llama-cpp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - maree-net

  # ============================================================
  # GODOT HEADLESS - Consommateur pur du flux (compute only)
  # ============================================================
  godot-headless:
    build:
      context: ./godot
      dockerfile: Dockerfile.headless
    container_name: maree-godot-headless
    runtime: nvidia
    environment:
      - SIMULATION_WS=ws://python-sim:8765
      - GODOT_RENDERING_DRIVER=dummy
    depends_on:
      python-sim:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [compute]
    networks:
      - maree-net

networks:
  maree-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  redpanda-data:
  sim-data:
  sim-logs:
