# ============================================================
# MARÉE v2 — stack de simulation
#
#   redpanda    bus d'événements + Schema Registry (Protobuf)
#   llama-cpp   routeur d'inférence local (E2B + bge-m3)
#   sim         moteur : JuPedSim + LangGraph + FAISS
#
# Le client Godot tourne sur l'hôte (`godot --path godot/project`) et se
# connecte à `maree serve`. Il n'est pas conteneurisé : le rendu OpenGL
# en container demanderait un serveur X ou noVNC, pour un gain nul.
#
# Le journal (source de vérité, décision 1) est écrit par `sim` en JSONL
# append-only ET publié sur Redpanda. Le rejeu lit le JSONL : il ne
# dépend ni du bus ni du LLM.
# ============================================================
name: maree

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------------------------------------
  # Bus d'événements + registre de schémas
  # ----------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:v26.2.4
    container_name: maree-redpanda
    logging: *logging
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --schema-registry-addr=0.0.0.0:8081
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "9092:9092"    # Kafka (hôte)
      - "8081:8081"    # Schema Registry
      - "8082:8082"    # HTTP Proxy
      - "9644:9644"    # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ----------------------------------------------------------
  # Inférence locale — routeur llama.cpp
  # ----------------------------------------------------------
  llama-cpp:
    image: maree/llama-cpp:b11609
    build:
      context: .
      dockerfile: llama.cpp/Dockerfile.prebuilt
    container_name: maree-llama
    logging: *logging
    command:
      - --models-preset
      - /presets/maree.ini
      - --models-max
      - "2"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - ./models:/models:ro
      - ./presets:/presets:ro
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ----------------------------------------------------------
  # Moteur de simulation
  # ----------------------------------------------------------
  sim:
    image: maree/sim:2.0.0
    build:
      context: .
      dockerfile: docker/sim.Dockerfile
    container_name: maree-sim
    logging: *logging
    depends_on:
      redpanda:
        condition: service_healthy
      llama-cpp:
        condition: service_started
    environment:
      MAREE_KAFKA_BOOTSTRAP: redpanda:29092
      MAREE_SCHEMA_REGISTRY: http://redpanda:8081
      MAREE_LLM_BASE_URL: http://llama-cpp:8080/v1
      MAREE_RUNS_DIR: /runs
    volumes:
      - ./runs:/runs
      - ./configs:/app/configs:ro
    command: ["maree", "run", "run=demo"]

volumes:
  redpanda-data:
