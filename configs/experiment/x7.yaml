# @package _global_
# ============================================================
# X7 — le RAG change-t-il la croyance ? (H7)
#
# Désactiver le RAG augmente-t-il l'écart croyance/réalité ?
#
# Sans RAG, l'agent décide sur sa seule perception et sa mémoire. Avec,
# il peut retrouver une consigne de sécurité ou un souvenir d'édition.
# C'est la seule expérience qui isole la contribution documentaire.
#
# I6 est retiré : aucune sortie ne ferme ici. La croyance se lit dans
# `counts.by_belief` et dans I2 (entropie) — pas dans un écart à une
# fermeture qui n'a pas lieu.
# ============================================================

experiment:
  id: X7
  hypothesis: H7
  indicators: [I2_entropy, I1_consensus, I3_evacuated, I7_delay]
  arms:
    - name: avec_rag
      description: bge-m3 + FAISS, filtré par profil et par tick
      rag:
        enabled: true
    - name: sans_rag
      description: aucune récupération documentaire
      rag:
        enabled: false
