# ============================================================
# Run de démonstration — scénario de référence
#
#   t10  fumée près de la scène
#   t18  annonce officielle (D3)
#   t40  (optionnel) fermeture de la sortie A — levier X2
#
# 72 ticks de 10 s = 12 minutes simulées.
# ============================================================
name: demo
max_ticks: 72

smoke_tick: 10
smoke_position: [44.0, 15.0]
smoke_radius: 15.0

close_exit: null
close_tick: 40

announcement_tick: 18
announcement: "Évacuation. Rejoignez la sortie nord."

max_concurrency: 4
message_radius: 8.0
density_radius: 3.0

# A2/B3 — false = bras « sans communication » (contrôle négatif de I1).
communication: true

# A1 — 0 = pas de passé ; 3 = préhistoire J-3 .. J-1 (table figée).
prehistory_days: 0

# D3 — pause reelle entre deux ticks. 0 = campagne (aussi vite que
# possible) ; `maree live --tick-ms 600` la surcharge pour la demo.
tick_delay_s: 0.0

# C4 — sync = tous les agents au même pas de temps ; async = chacun agit
# quand sa réponse arrive (latence réelle du modèle).
mode: sync

# C3 — latence de livraison d'un message, en ticks. 0 = le voisin entend
# au tick même (campagnes X1–X9) ; 2 = un mot met 20 s simulées à passer.
message_delay_ticks: 0
