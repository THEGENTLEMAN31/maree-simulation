# ============================================================
# Port-Aubel — esplanade du quai, Fête des Lanternes
#
# 60 x 40 m. Trois sorties de largeurs très inégales : c'est la
# géométrie qui produit les goulots, pas un paramètre de débit.
#
#   A  Grand Quai          6,0 m   nord    l'évidente
#   B  Ruelle des Cordiers 1,5 m   est     cachée derrière les stands
#   C  Passage des Halles  3,0 m   sud     à contre-courant
#
# La ruelle B n'est connue que du profil `habitue` : c'est le levier
# narratif du scénario (le savoir local sauve, l'ignorance piège).
# ============================================================
name: port_aubel
width: 60.0
height: 40.0

walkable:
  - [5.0, 5.0]
  - [55.0, 5.0]
  - [55.0, 35.0]
  - [5.0, 35.0]

exits:
  - id: A
    label: Grand Quai
    a: [26.0, 35.0]
    b: [32.0, 35.0]
  - id: B
    label: Ruelle des Cordiers
    a: [55.0, 16.0]
    b: [55.0, 17.5]
  - id: C
    label: Passage des Halles
    a: [14.0, 5.0]
    b: [17.0, 5.0]

# Les zones servent à la PERCEPTION et au langage, pas au déplacement.
# Elles partitionnent l'esplanade : un point appartient à une seule zone.
zones:
  - id: Z7
    label: Fontaine
    polygon: [[5.0, 24.0], [18.0, 24.0], [18.0, 35.0], [5.0, 35.0]]
  - id: Z1
    label: Place nord
    polygon: [[18.0, 24.0], [36.0, 24.0], [36.0, 35.0], [18.0, 35.0]]
  - id: Z2
    label: Place est
    polygon: [[36.0, 24.0], [55.0, 24.0], [55.0, 35.0], [36.0, 35.0]]
  - id: Z4
    label: Place ouest
    polygon: [[5.0, 14.0], [18.0, 14.0], [18.0, 24.0], [5.0, 24.0]]
  - id: Z5
    label: Centre
    polygon: [[18.0, 14.0], [36.0, 14.0], [36.0, 24.0], [18.0, 24.0]]
  # Déclarée AVANT Z6 : `zone_of` retourne la première zone contenante.
  - id: Z8
    label: Ruelle
    polygon: [[50.0, 14.0], [55.0, 14.0], [55.0, 24.0], [50.0, 24.0]]
    hidden: true
  - id: Z6
    label: Scène
    polygon: [[36.0, 5.0], [50.0, 5.0], [50.0, 24.0], [36.0, 24.0]]
  - id: Z3
    label: Place sud
    polygon: [[5.0, 5.0], [36.0, 5.0], [36.0, 14.0], [5.0, 14.0]]

obstacles:
  - id: tour
    kind: tour
    polygon: [[26.0, 18.0], [30.0, 18.0], [30.0, 22.0], [26.0, 22.0]]
  - id: fontaine
    kind: fontaine
    polygon: [[12.0, 23.8], [13.8, 23.8], [14.5, 26.0], [13.8, 28.2],
              [12.0, 28.2], [10.2, 28.2], [9.5, 26.0], [10.2, 23.8]]
  - id: scene
    kind: scene
    polygon: [[40.0, 10.0], [48.0, 10.0], [48.0, 15.0], [40.0, 15.0]]
  - id: stand_1
    kind: stand
    polygon: [[46.0, 20.0], [49.0, 20.0], [49.0, 22.0], [46.0, 22.0]]
  - id: stand_2
    kind: stand
    polygon: [[46.0, 16.0], [49.0, 16.0], [49.0, 18.0], [46.0, 18.0]]
  - id: stand_3
    kind: stand
    polygon: [[10.0, 9.0], [13.0, 9.0], [13.0, 11.0], [10.0, 11.0]]
  - id: stand_4
    kind: stand
    polygon: [[16.0, 9.0], [19.0, 9.0], [19.0, 11.0], [16.0, 11.0]]

#: Source de fumée (près de la scène) et portée de visibilité.
smoke:
  position: [44.0, 15.0]
  radius: 15.0
  start_tick: 10
