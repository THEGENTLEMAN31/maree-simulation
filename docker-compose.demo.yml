# ============================================================
# Override demo : ajoute Godot VNC (interface navigateur :6080)
# Usage : docker compose -f docker-compose.yml -f docker-compose.demo.yml up
# Le service rejoint le réseau maree-net défini dans docker-compose.yml.
#
# Éditeur Godot (modification de la scène dans le navigateur) :
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml \
#     --profile editor up godot-editor
#   → http://localhost:6081
# Le projet est monté depuis l'hôte : les modifications sont persistées.
# ============================================================

services:
  godot-vnc:
    build:
      context: ./godot
      dockerfile: Dockerfile.vnc
    container_name: maree-godot-vnc
    runtime: nvidia
    environment:
      - SIM_WS_URL=ws://python-sim:8765
      - GODOT_FLAGS=
    ports:
      - "6080:6080"   # noVNC web UI
      - "5900:5900"   # VNC direct
    volumes:
      - ./godot/project:/godot/project
    depends_on:
      python-sim:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - maree-net

  # Éditeur Godot dans le navigateur (profil "editor").
  godot-editor:
    build:
      context: ./godot
      dockerfile: Dockerfile.vnc
    container_name: maree-godot-editor
    runtime: nvidia
    environment:
      - SIM_WS_URL=ws://python-sim:8765
      - GODOT_FLAGS=--editor
    ports:
      - "6081:6080"   # noVNC web UI (éditeur)
      - "5901:5900"   # VNC direct (éditeur)
    volumes:
      - ./godot/project:/godot/project
    profiles:
      - editor
    networks:
      - maree-net
